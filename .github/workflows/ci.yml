name: CI

# En cada push a cualquier rama, no solo a main: el trabajo se hace en ramas
# que Vercel despliega como vista previa y que solo llegan a main —que es
# producción— con el visto bueno del promotor. Si la CI corriera solo en main,
# los tests pasarían por primera vez después de desplegar.
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
